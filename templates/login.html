<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login - ClassLens</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .login-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 40px; border-radius: 12px; border: 1px solid rgba(139, 92, 246, 0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; }
        .login-box h2 { margin-top: 0; font-weight: 600; letter-spacing: 1px; color: #a855f7; font-size: 28px;}
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: white; border-radius: 6px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #a855f7; }
        button { width: 100%; padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #7c3aed; }
        .error { color: #ef4444; font-size: 14px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ClassLens</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 30px;">Instructor Portal Authentication</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Instructor ID" required>
            <input type="password" name="password" placeholder="Passcode" required>
            <button type="submit">Initialize Dashboard</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
